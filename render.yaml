# Render Infrastructure as Code (Blueprint)
# Learn more: https://render.com/docs/yaml

services:
  - type: web
    name: go-chat
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      # Turso DB credentials — stored as Render Secrets (never committed to code)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Admin panel credentials — set in Render dashboard, NEVER commit to git
      - key: ADMIN_EMAIL
        sync: false   # e.g. admin@gochat.internal
      - key: ADMIN_PASSWORD
        sync: false   # your secure admin password
